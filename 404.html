<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; base-uri 'none'; form-action 'none'">
  <title>404 · Page not found</title>
  <link rel="stylesheet" href="/css/style.css?v=7">
  <style>
    body{display:grid;place-items:center;min-height:100vh;text-align:center;padding:24px}
    .nf{font-family:var(--fm);color:var(--t2)}
    .nf h1{font-family:var(--fd);font-size:clamp(56px,14vw,120px);color:var(--cyn);line-height:1}
    .nf p{margin:14px 0 26px;font-size:15px}
    .nf a{display:inline-block;padding:12px 22px;border:1px solid var(--cyn);color:var(--cyn);border-radius:6px}
  </style>
</head>
<body>
  <main class="nf">
    <h1>404</h1>
    <p>[ERROR] This page does not exist.</p>
    <a href="/">Back to the portfolio</a>
  </main>
</body>
</html>
